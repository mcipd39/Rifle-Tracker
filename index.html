    @keyframes fadeInOut {

      15% { opacity: 1; bottom: 80px; }

      font-size: 14px; z-index: 9999; box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
      animation: fadeInOut 2.5s forwards;

      appearance: none; 
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23a1a1aa' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");

<script>
Chart.defaults.color = '#a1a1aa';
Chart.defaults.borderColor = '#27272a'; 
Chart.defaults.font.family = 'system-ui, -apple-system, sans-serif';

let state = { firearms: [], barrels: [], shootingLogs: [], recipes: [], components: [], rifleLands: [], maintenance: [] };
let velocityChartInstance = null;
let currentTab = 'dashboard';
let currentType = null, currentEditId = null;

// --- STATE MANAGEMENT ---
function saveState() { 
  localStorage.setItem('precisionReloadTracker', JSON.stringify(state)); 
  updateGlobalUI(); 
}

function loadState() { 
  const s = localStorage.getItem('precisionReloadTracker');
  if (s) {
    try {
      state = JSON.parse(s); 
    } catch(e) {
      console.error("Could not parse saved state", e);
    }
  }
}

function generateId() { 
  return 'id_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
}

function showToast(message) {
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = message;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 2500);
}

// --- GLOBAL UI & HELPERS ---
function updateGlobalUI() {
  const isLow = state.components.some(c => parseFloat(c.quantity) < parseFloat(c.reorderLevel));
  const stockBadge = document.getElementById('nav-stock-badge');
  if (stockBadge) {
    stockBadge.style.display = isLow ? 'block' : 'none';
  }
  
  const rifleDropdowns = ['filter-shooting-rifle', 'filter-lands-rifle', 'filter-maint-rifle'];
  rifleDropdowns.forEach(id => {
    const select = document.getElementById(id);
    if (!select) return;
    const currentVal = select.value;
    select.innerHTML = '<option value="">All Rifles</option>';
    state.firearms.forEach(f => {
      const opt = document.createElement('option');
      opt.value = f.id; opt.textContent = `${f.make} ${f.model}`;
      if (f.id === currentVal) opt.selected = true;
      select.appendChild(opt);
    });
  });

  // Note: chart-rifle-select is populated inside renderDashboard() only.
  // This avoids constant DOM rebuilds that can interfere with native <select> behavior.
  
  const calSelect = document.getElementById('filter-recipe-cal');
  if (calSelect) {
    const currentCal = calSelect.value;
    const uniqueCals = [...new Set(state.recipes.map(r => r.caliber).filter(Boolean))];
    calSelect.innerHTML = '<option value="">All Calibers</option>';
    uniqueCals.forEach(cal => {
      const opt = document.createElement('option');
      opt.value = cal; opt.textContent = cal;
      if (cal === currentCal) opt.selected = true;
      calSelect.appendChild(opt);
    });
  }
}

function getTotalRoundsForFirearm(id) {
  return state.shootingLogs.filter(l => l.firearmId === id).reduce((sum, l) => sum + (parseInt(l.roundsFired) || 0), 0);
}

function getLastMaintenanceDate(rifleId) {
  const entries = state.maintenance.filter(m => m.rifleId === rifleId);
  if (entries.length === 0) return null;
  return entries.sort((a,b) => new Date(b.date) - new Date(a.date))[0].date;
}

function getCurrentBarrel(rifleId) {
  return state.barrels.find(b => b.firearmId === rifleId && b.isCurrent);
}

function calculateJump(r) {
  if (!r.cbto || !r.touchingLandsCBTO) return null;
  return parseFloat(r.touchingLandsCBTO) - parseFloat(r.cbto);
}

function getDistanceText(r) {
  const j = calculateJump(r);
  if (j === null) return '&mdash;'; 
  return j >= 0 ? `${j.toFixed(3)}" jump` : `${Math.abs(j).toFixed(3)}" jam`;
}

// --- Utility functions for stats and common calculations ---
function calculateVelocityStats(velocities) {
  if (!velocities || velocities.length === 0) return null;
  const nums = velocities.map(v => parseFloat(v)).filter(v => !isNaN(v));
  if (nums.length === 0) return null;

  const n = nums.length;
  const sum = nums.reduce((a, b) => a + b, 0);
  const avg = sum / n;
  const min = Math.min(...nums);
  const max = Math.max(...nums);
  const es = max - min;

  // Population standard deviation
  const variance = nums.reduce((acc, val) => acc + Math.pow(val - avg, 2), 0) / n;
  const sd = Math.sqrt(variance);

  return {
    avg: parseFloat(avg.toFixed(0)),
    sd: parseFloat(sd.toFixed(1)),
    es: parseFloat(es.toFixed(0)),
    min: parseFloat(min.toFixed(0)),
    max: parseFloat(max.toFixed(0)),
    count: n
  };
}

function getRoundsSinceLastCleaning(rifleId) {
  const maintenanceEntries = state.maintenance
    .filter(m => m.rifleId === rifleId)
    .sort((a, b) => new Date(b.date) - new Date(a.date));

  if (maintenanceEntries.length === 0) {
    return getTotalRoundsForFirearm(rifleId);
  }

  const lastCleanDate = maintenanceEntries[0].date;
  const logsAfterCleaning = state.shootingLogs.filter(l => 
    l.firearmId === rifleId && l.date >= lastCleanDate
  );
  return logsAfterCleaning.reduce((sum, l) => sum + (parseInt(l.roundsFired) || 0), 0);
}

// Duplicate a recipe
function duplicateRecipe(recipeId) {
  const original = state.recipes.find(r => r.id === recipeId);
  if (!original) return;

  const copy = JSON.parse(JSON.stringify(original)); // deep clone
  copy.id = generateId();
  copy.bulletMake = original.bulletMake || '';
  copy.bulletModel = original.bulletModel || '';
  // Clear linked inventory to avoid accidental deduction on new recipe
  copy.compIdBullet = null;
  copy.compIdPrimer = null;
  copy.compIdPowder = null;

  state.recipes.push(copy);
  saveState();
  renderCurrentTab();
  showToast("Recipe duplicated! You can now edit the copy.");
  // Open the new copy for editing
  setTimeout(() => showEditModal('recipes', copy.id), 50);
}

// Quick log a shooting session using this recipe
function logRecipe(recipeId) {
  const recipe = state.recipes.find(r => r.id === recipeId);
  if (!recipe) return;

  // Pre-fill the shooting modal with this recipe
  currentType = 'shooting';
  currentEditId = null;
  showModalWithForm('shooting');

  // After modal renders, pre-select the recipe
  setTimeout(() => {
    const recipeSelect = document.getElementById('s-recipe');
    if (recipeSelect) {
      recipeSelect.value = recipeId;

      // Also try to pre-select the rifle if the recipe has one linked
      if (recipe.firearmId) {
        const firearmSelect = document.getElementById('s-firearm');
        if (firearmSelect) {
          firearmSelect.value = recipe.firearmId;
          // Trigger barrel filter safely
          if (typeof filterBarrelsByRifle === 'function') {
            try { filterBarrelsByRifle(); } catch(e) { console.warn('filterBarrelsByRifle error', e); }
          }
        }
      }
    }
  }, 120);
}

// Ladder Test / Multi-Load logging (detailed per-load testing with recipe-like fields + jump calculator)
function showLadderTestModal() {
  const modal = document.getElementById('modal');
  const titleEl = document.getElementById('modal-title');
  const body = document.getElementById('modal-body');

  titleEl.textContent = 'Ladder Test / Multi-Load Session';
  body.innerHTML = `
    <div class="space-y-4">
      <!-- Common Session Info -->
      <div class="grid grid-cols-3 gap-3">
        <div>
          <label class="text-xs text-zinc-400">Rifle</label>
          <select id="lt-rifle" class="w-full mt-1 px-3 py-2 rounded-2xl border border-zinc-700"></select>
        </div>
        <div>
          <label class="text-xs text-zinc-400">Barrel</label>
          <select id="lt-barrel" class="w-full mt-1 px-3 py-2 rounded-2xl border border-zinc-700"></select>
        </div>
        <div>
          <label class="text-xs text-zinc-400">Date</label>
          <input type="date" id="lt-date" value="${new Date().toISOString().split('T')[0]}" class="w-full mt-1 px-3 py-2 rounded-2xl border border-zinc-700">
        </div>
      </div>

      <div>
        <label class="text-xs text-zinc-400">Session Notes</label>
        <textarea id="lt-session-notes" class="w-full mt-1 px-3 py-2 rounded-2xl border border-zinc-700 h-12 text-sm" placeholder="Range conditions, overall observations..."></textarea>
      </div>

      <!-- Dynamic Load Rows -->
      <div>
        <div class="flex justify-between items-center mb-2">
          <div class="text-sm font-medium text-emerald-400">Loads Tested</div>
          <button onclick="addLadderLoadRow()" class="text-xs bg-emerald-700 hover:bg-emerald-600 px-3 py-1 rounded-xl">+ Add Load</button>
        </div>
        <div id="ladder-loads-container" class="space-y-3"></div>
      </div>

      <div class="flex gap-3 pt-2">
        <button onclick="hideModal()" class="flex-1 py-3 bg-zinc-800 rounded-2xl">Cancel</button>
        <button onclick="saveLadderTestSession()" class="flex-1 py-3 bg-emerald-700 rounded-2xl font-medium">Save All Loads</button>
      </div>
    </div>
  `;

  // Populate rifle dropdown
  const rifleSelect = document.getElementById('lt-rifle');
  state.firearms.forEach(f => {
    const opt = document.createElement('option');
    opt.value = f.id;
    opt.textContent = `${f.make} ${f.model}`;
    rifleSelect.appendChild(opt);
  });

  rifleSelect.onchange = () => {
    const barrelSelect = document.getElementById('lt-barrel');
    barrelSelect.innerHTML = '<option value="">-- Any --</option>';
    state.barrels.filter(b => b.firearmId === rifleSelect.value).forEach(b => {
      const opt = document.createElement('option');
      opt.value = b.id;
      opt.textContent = `${b.name || b.length} ${b.material || ''} ${b.isCurrent ? '(Current)' : ''}`;
      barrelSelect.appendChild(opt);
    });
  };

  // Add first load row
  setTimeout(() => {
    addLadderLoadRow();
  }, 80);

  modal.classList.remove('hidden');
  modal.classList.add('flex');
}

// Save all loads from the Ladder Test modal
function saveLadderTestSession() {
  const rifleId = document.getElementById('lt-rifle').value;
  const barrelId = document.getElementById('lt-barrel').value || null;
  const date = document.getElementById('lt-date').value;
  const sessionNotes = document.getElementById('lt-session-notes').value || '';

  const container = document.getElementById('ladder-loads-container');
  const rows = container.querySelectorAll('[id^="load-row-"]');

  if (rows.length === 0) {
    alert("Please add at least one load to test.");
    return;
  }

  rows.forEach(row => {
    const getVal = (cls) => row.querySelector('.' + cls)?.value || '';

    const recipeId = getVal('load-recipe') || null;
    const notes = getVal('load-notes');

    const logEntry = {
      id: generateId(),
      date: date,
      firearmId: rifleId,
      barrelId: barrelId,
      recipeId: recipeId,
      roundsFired: parseInt(getVal('load-rounds')) || 10,
      velocity: parseInt(getVal('load-velocity')) || null,
      groupSize: getVal('load-group') || null,
      sd: parseFloat(getVal('load-sd')) || null,
      es: parseFloat(getVal('load-es')) || null,
      notes: sessionNotes 
        ? `${sessionNotes}
---
Load: ${getVal('load-bullet-make')} ${getVal('load-bullet-model')} ${getVal('load-grains')}gr | ${getVal('load-powder')} @ ${getVal('load-charge')}gr
${notes}`
        : `Load: ${getVal('load-bullet-make')} ${getVal('load-bullet-model')} ${getVal('load-grains')}gr | ${getVal('load-powder')} @ ${getVal('load-charge')}gr
${notes}`
    };

    state.shootingLogs.push(logEntry);
  });

  saveState();
  hideModal();
  renderCurrentTab();
  showToast(`${rows.length} load(s) saved from ladder test!`);
}

// --- NEW: Unique value helpers for datalists & auto-suggest in recipes ---
function getUniqueCalibers() {
  const fromFirearms = state.firearms.map(f => f.caliber).filter(Boolean);
  const fromRecipes = state.recipes.map(r => r.caliber).filter(Boolean);
  return [...new Set([...fromFirearms, ...fromRecipes])].sort();
}

function getUniqueBulletMakes() {
  return [...new Set(state.recipes.map(r => r.bulletMake).filter(Boolean))].sort();
}

function getUniqueBulletModels() {
  const models = state.recipes.map(r => r.bulletModel).filter(Boolean);
  // Also include legacy 'bullet' field for suggestions if present
  const legacy = state.recipes.map(r => r.bullet).filter(Boolean);
  return [...new Set([...models, ...legacy])].sort();
}

function getUniquePowders() {
  return [...new Set(state.recipes.map(r => r.powder).filter(Boolean))].sort();
}

function getUniquePrimers() {
  const fromRecipes = state.recipes.map(r => r.primer).filter(Boolean);
  const fromComponents = state.components
    .filter(c => c.itemType === 'Primer')
    .map(c => c.nameSpec || `${c.manufacturer || ''} ${c.nameSpec || ''}`.trim())
    .filter(Boolean);
  return [...new Set([...fromRecipes, ...fromComponents])].sort();
}

function getUniqueBulletGrains() {
  const fromRecipes = state.recipes.map(r => r.bulletGrains).filter(Boolean);
  // Also try to extract grains from existing bulletModel strings like "ELD-M 140gr" or "140 gr"
  const extracted = state.recipes
    .map(r => {
      if (!r.bulletModel) return null;
      const match = r.bulletModel.match(/(\d+)\s*(gr|grain|grains)?/i);
      return match ? match[1] : null;
    })
    .filter(Boolean);
  const fromComponents = state.components
    .filter(c => c.itemType === 'Bullet' && c.grains)
    .map(c => c.grains);
  return [...new Set([...fromRecipes, ...extracted, ...fromComponents])].sort((a,b) => parseInt(a) - parseInt(b) || a.localeCompare(b));
}

function getUniqueBrass() {
  const fromRecipes = state.recipes.map(r => r.brass).filter(Boolean);
  const fromComponents = state.components
    .filter(c => c.itemType === 'Brass')
    .map(c => c.nameSpec || `${c.manufacturer || ''} ${c.nameSpec || ''}`.trim())
    .filter(Boolean);
  return [...new Set([...fromRecipes, ...fromComponents])].sort();
}

// Dependent dropdowns and auto-populate for Recipe modal
function filterBarrelsForRecipe(selectedBarrelId = null) {
  const rifleSelect = document.getElementById('r-firearm');
  const barrelSelect = document.getElementById('r-barrel');
  if (!rifleSelect || !barrelSelect) return;
  
  barrelSelect.innerHTML = `<option value="">-- Any Barrel --</option>`;
  let barrelsToShow = state.barrels;
  if (rifleSelect.value) {
    barrelsToShow = barrelsToShow.filter(b => b.firearmId === rifleSelect.value);
  }
  barrelsToShow.forEach(b => {
    const rifle = state.firearms.find(f => f.id === b.firearmId);
    const opt = document.createElement('option');
    opt.value = b.id;
    let txt = `${b.name ? b.name + ' â¢ ' : ''}${b.length || ''} ${b.material || ''}`;
    if (rifle && !rifleSelect.value) txt = `${rifle.make} ${rifle.model} â¢ ${txt}`; // show rifle when listing all
    if (b.isCurrent) txt += ' (Current)';
    opt.innerHTML = txt;
    if (selectedBarrelId && selectedBarrelId === b.id) opt.selected = true;
    barrelSelect.appendChild(opt);
  });

  landsSelect.innerHTML = `<option value="">-- Manual --</option>`;

    const makeInput = document.getElementById('r-bullet-make');
    const modelInput = document.getElementById('r-bullet-model');
    if (rl.bullet) {
      if (makeInput && !makeInput.value.trim()) {
        // Try to split first word as make, rest as model (common pattern)
        const parts = rl.bullet.trim().split(/\s+/);
        if (parts.length > 1 && !modelInput.value.trim()) {
          makeInput.value = parts[0];
          modelInput.value = parts.slice(1).join(' ');

          modelInput.value = rl.bullet;
        }
      }
    }
    updateJumpPreview();
  }
}

// --- IMAGE COMPRESSOR FOR LOCAL STORAGE ---
function compressAndPreviewImage(event) {
  const file = event.target.files[0];
  if (!file) return;
  
  const reader = new FileReader();
  reader.onload = function(e) {
    const img = new Image();
    img.onload = function() {
      const canvas = document.createElement('canvas');
      const MAX_WIDTH = 500;
      const MAX_HEIGHT = 500;
      let width = img.width;
      let height = img.height;

      // Maintain aspect ratio while sizing down
      if (width > height) {
        if (width > MAX_WIDTH) {
          height *= MAX_WIDTH / width;
          width = MAX_WIDTH;
        }
      } else {
        if (height > MAX_HEIGHT) {
          width *= MAX_HEIGHT / height;
          height = MAX_HEIGHT;
        }
      }

      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);
      
      // Compress to JPEG at 70% quality to save space
      const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
      
      const preview = document.getElementById('f-photo-preview');
      preview.src = dataUrl;
      preview.classList.remove('hidden');
      preview.classList.add('block');
    }
    img.src = e.target.result;
  }
  reader.readAsDataURL(file);
}

// --- CHARTING ---
function updateVelocityChart() {
  const ctx = document.getElementById('velocityChart');
  const emptyState = document.getElementById('chart-empty-state');
  const select = document.getElementById('chart-rifle-select');
  
  if (velocityChartInstance) {
    velocityChartInstance.destroy();
    velocityChartInstance = null;
  }

  const rifleId = select.value;
  if (!rifleId) return;

  const logs = state.shootingLogs
    .filter(l => l.firearmId === rifleId && l.recipeId && l.velocity && parseInt(l.velocity) > 0)
    .sort((a, b) => new Date(a.date) - new Date(b.date));
    
  if (logs.length === 0) {
    ctx.style.display = 'none';
    emptyState.classList.remove('hidden');
    const statsEl = document.getElementById('velocity-stats');
    if (statsEl) statsEl.innerHTML = '';
    return;
  }

  ctx.style.display = 'block';
  emptyState.classList.add('hidden');
  
  const labels = logs.map(l => {
    const parts = l.date.split('-');
    if (parts.length === 3) return `${parts[1]}/${parts[2]}`;
    return l.date;
  });
  
  const data = logs.map(l => parseInt(l.velocity));
  const calculatedStats = calculateVelocityStats(data);

  // Also look for the latest manual SD/ES from logs that are linked to a verified recipe
  const latestManualStats = [...state.shootingLogs]
    .filter(l => l.firearmId === rifleId && l.recipeId && (l.sd || l.es))
    .sort((a, b) => new Date(b.date) - new Date(a.date))[0];

  // Display velocity statistics
  const statsEl = document.getElementById('velocity-stats');
  if (statsEl) {
    if (calculatedStats && calculatedStats.count > 1) {
      // Prefer calculated stats when we have multiple individual velocities
      statsEl.innerHTML = `
        <span class="text-emerald-400">Avg: ${calculatedStats.avg}</span> â¢ 
        SD: ${calculatedStats.sd} â¢ 
        ES: ${calculatedStats.es} 
        <span class="text-zinc-500">(${calculatedStats.count} shots)</span>
      `;
    } else if (latestManualStats) {
      // Fall back to latest manually entered SD/ES
      statsEl.innerHTML = `
        Latest Session: 
        ${latestManualStats.sd ? `SD ${latestManualStats.sd}` : ''}
        ${latestManualStats.es ? `${latestManualStats.sd ? ' â¢ ' : ''}ES ${latestManualStats.es}` : ''}
        <span class="text-zinc-500">(manual)</span>
      `;
    } else {
      statsEl.innerHTML = '';
    }
  }

  velocityChartInstance = new Chart(ctx, {
    type: 'line',
    data: {
      labels: labels,
      datasets: [{
        label: 'Velocity (fps)',
        data: data,
        borderColor: '#34d399', 
        backgroundColor: 'rgba(52, 211, 153, 0.15)',
        borderWidth: 2,
        pointBackgroundColor: '#10b981',
        pointBorderColor: '#09090b',
        pointRadius: 4,
        fill: true,
        tension: 0.3
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        y: { 
          title: { display: true, text: 'FPS', color: '#71717a', font: {size: 10} },
          suggestedMin: Math.min(...data) - 20,
          suggestedMax: Math.max(...data) + 20
        },
        x: { ticks: { maxTicksLimit: 8 } }
      }
    }
  });
}

// --- NAVIGATION ---
function switchTab(tab) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.getElementById(`section-${tab}`).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  
  const nav = document.getElementById(`nav-${tab}`);
  if (nav) nav.classList.add('active');
  
  currentTab = tab;
  renderCurrentTab();
}

function renderShooting() {
  const searchTerm = (document.getElementById('shooting-search')?.value || '').toLowerCase();
  const rifleFilter = document.getElementById('filter-shooting-rifle')?.value;
  const dateFilter = document.getElementById('filter-shooting-date')?.value;
  const el = document.getElementById('shooting-list');

  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());

  const filtered = state.shootingLogs.filter(log => {
    const f = state.firearms.find(x => x.id === log.firearmId);
    const rifleName = f ? `${f.make} ${f.model}`.toLowerCase() : '';
    const matchSearch = rifleName.includes(searchTerm) || (log.notes || '').toLowerCase().includes(searchTerm);
    const matchRifle = !rifleFilter || log.firearmId === rifleFilter;

    let matchDate = true;
    if (dateFilter) {
      const logDate = new Date(log.date);
      if (dateFilter === '7') {
        const sevenDaysAgo = new Date(today);
        sevenDaysAgo.setDate(today.getDate() - 7);
        matchDate = logDate >= sevenDaysAgo;
      } else if (dateFilter === '30') {
        const thirtyDaysAgo = new Date(today);
        thirtyDaysAgo.setDate(today.getDate() - 30);
        matchDate = logDate >= thirtyDaysAgo;
      } else if (dateFilter === 'this-month') {
        matchDate = logDate.getMonth() === today.getMonth() && logDate.getFullYear() === today.getFullYear();
      }
    }

    return matchSearch && matchRifle && matchDate;
  });
  
  el.innerHTML = filtered.length === 0 ? `<div class="text-center py-8 text-zinc-500">No matching sessions</div>` : '';
  
  [...filtered].sort((a,b) => new Date(b.date) - new Date(a.date)).forEach(log => {
    const f = state.firearms.find(x => x.id === log.firearmId);
    const recipe = state.recipes.find(r => r.id === log.recipeId);
    const displayBullet = recipe 
      ? (recipe.bulletMake 
          ? `${recipe.bulletMake} ${recipe.bulletModel || ''}`.trim() 
          : (recipe.bullet || recipe.bulletModel || 'Unknown')) 
      : '';

    const card = document.createElement('div');
    card.className = `card bg-zinc-900 border border-zinc-800 rounded-3xl p-4 flex justify-between items-center cursor-pointer`;
    card.innerHTML = `
      <div>
        <div class="font-medium">${log.date}</div>
        <div class="text-sm">${f ? f.make + ' ' + f.model : 'Unknown'}</div>
        ${log.velocity ? `<div class="text-xs text-zinc-400 mt-1">${log.velocity} fps</div>` : ''}
        ${(log.sd || log.es) ? `
          <div class="text-[10px] text-emerald-400 mt-0.5">
            ${log.sd ? `SD ${log.sd}` : ''}
            ${log.es ? ` â¢ ES ${log.es}` : ''}
          </div>
        ` : ''}
        ${recipe ? `<div class="text-[10px] text-emerald-500 mt-0.5"><i class="fa-solid fa-flask"></i> ${displayBullet} (${recipe.chargeGr}gr)</div>` : ''}
      </div>
      <div class="flex items-center gap-x-3">
        <div class="text-right">
          <div class="text-2xl font-semibold text-emerald-400">${log.roundsFired}</div>

        <button class="delete-btn text-red-400 hover:text-red-500 p-2"><i class="fa-solid fa-trash text-lg pointer-events-none"></i></button>
      </div>
    `;
    card.onclick = () => showEditModal('shooting', log.id);
    card.querySelector('.delete-btn').onclick = (e) => {
      e.stopPropagation();
      deleteItem('shootingLogs', log.id);

    // Save as Recipe button

// --- DATA ACTIONS ---
function deleteItem(collection, id) {
  if (!confirm('Are you sure you want to delete this item?')) return;
  state[collection] = state[collection].filter(item => item.id !== id);
  
  // Cascading cleanup to prevent orphaned data
  if (collection === 'firearms') {
    state.barrels = state.barrels.filter(b => b.firearmId !== id);
    state.shootingLogs = state.shootingLogs.filter(l => l.firearmId !== id);
    state.maintenance = state.maintenance.filter(m => m.rifleId !== id);
    state.rifleLands = state.rifleLands.filter(r => r.rifleId !== id);
    state.recipes.forEach(r => { if (r.firearmId === id) { r.firearmId = null; r.barrelId = null; } });
  } else if (collection === 'barrels') {
    state.rifleLands = state.rifleLands.filter(r => r.barrelId !== id);
    state.recipes.forEach(r => { if (r.barrelId === id) r.barrelId = null; });
  }
  
  saveState();
  renderCurrentTab();
  showToast("Item deleted");
}

    const firearmOptions = state.firearms.map(f => `<option value="${f.id}" ${item.rifleId === f.id ? 'selected' : ''}>${f.make} ${f.model}</option>`).join('');
    html = `
      <div class="space-y-4">
        <div><label class="text-xs text-zinc-400">Rifle</label><select id="m-rifle" class="w-full mt-1 px-3 py-2 rounded-2xl border border-zinc-700">${firearmOptions}</select></div>

        <div>
          <label class="text-xs text-zinc-400">Action</label>
          <select id="m-action" class="w-full mt-1 px-3 py-2 rounded-2xl border border-zinc-700">
            <option value="">Custom...</option>
            <option value="Cleaned + lubed" ${item.action === 'Cleaned + lubed' ? 'selected' : ''}>Cleaned + lubed</option>
            <option value="Carbon ring removed" ${item.action === 'Carbon ring removed' ? 'selected' : ''}>Carbon ring removed</option>
            <option value="Full cleaning" ${item.action === 'Full cleaning' ? 'selected' : ''}>Full cleaning</option>
          </select>
        </div>
        <div><label class="text-xs text-zinc-400">Parts Replaced</label><input id="m-parts" value="${item.partsReplaced || ''}" class="w-full mt-1 px-3 py-2 rounded-2xl border border-zinc-700"></div>
        <div><label class="text-xs text-zinc-400">Notes</label><textarea id="m-notes" class="w-full mt-1 px-3 py-2 rounded-2xl border border-zinc-700 h-20">${item.notes || ''}</textarea></div>
      </div>`;
  }

  body.innerHTML = html;
  modal.classList.remove('hidden');
  modal.classList.add('flex');

  // Trigger dependant selects / previews
  if (type === 'shooting') {
    const item = currentEditId ? state.shootingLogs.find(x => x.id === currentEditId) : {};
    filterBarrelsByRifle(item.barrelId || null);

    // Populate recipe options in the load details section
    setTimeout(() => {
      const recipeSelect = document.getElementById('s-load-recipe');
      if (recipeSelect) {
        const recipes = state.recipes.map(r => {
          const display = r.bulletMake 
            ? `${r.bulletMake} ${r.bulletModel || ''}`.trim() 
            : (r.bullet || r.bulletModel || 'Unknown');
          return `<option value="${r.id}">${r.caliber} - ${display} (${r.chargeGr}gr)</option>`;
        }).join('');
        recipeSelect.innerHTML = `<option value="">-- None --</option>${recipes}`;
        if (item.recipeId) recipeSelect.value = item.recipeId;
      }
    }, 50);
  }
  if (type === 'ladder-test') {
    // Attach listeners for two-way jump in ladder test modal
    setTimeout(() => {
      const lands = document.getElementById('lt-lands');
      const cbto = document.getElementById('lt-cbto');
      if (lands && cbto) {
        lands.addEventListener('input', updateLadderJumpPreview);
        cbto.addEventListener('input', updateLadderJumpPreview);
      }
    }, 50);
  }
  if (type === 'rifle-lands') {
    const item = currentEditId ? state.rifleLands.find(x => x.id === currentEditId) : {};
    filterBarrelsForLands(item.barrelId || null);
  }
  if (type === 'recipes') {
    const item = currentEditId ? state.recipes.find(x => x.id === currentEditId) : {};
    // Use improved filter + preselect barrel, then populate suggestions and dependent lands
    filterBarrelsForRecipe(item.barrelId);
    populateRecipeDatalists();
    populateRecipeLandsOptions(item.rifleLandsId || null);
    
    // Also ensure caliber is populated from rifle if missing (in case rifle pre-selected)
    autoPopulateCaliberFromRifle();
    
    const cbto = document.getElementById('r-cbto');
    const landsInput = document.getElementById('r-lands');
    const desiredJump = document.getElementById('r-desired-jump');
    if (cbto && landsInput) {
      cbto.addEventListener('input', updateJumpFromCBTO);
      landsInput.addEventListener('input', updateJumpFromCBTO);
      updateJumpPreview();
    }
    if (desiredJump) {
      desiredJump.addEventListener('input', calculateCBTOFromDesiredJump);
    }
    
    // Optional: also listen to r-linked change for jump (though onchange already calls autoFill which does)
    const linkedLands = document.getElementById('r-linked');
    if (linkedLands) {
      // already has onchange="autoFillLands()" in html which updates preview
    }
  }

  if (type === 'components') {
    setupComponentSizeField();
    populateRecipeDatalists(); // Make suggestions available in Components too
  }
}

function updateJumpPreview() {
  const cbto = parseFloat(document.getElementById('r-cbto')?.value);
  const lands = parseFloat(document.getElementById('r-lands')?.value);
  const preview = document.getElementById('jump-preview');
  if (!preview) return;

  if (!cbto || !lands) { 
    preview.innerHTML = '&mdash;'; 
    return; 
  }
  const j = lands - cbto;
  preview.innerHTML = j >= 0 ? `${j.toFixed(3)}" jump` : `${Math.abs(j).toFixed(3)}" jam`;
}

// New two-way jump support
function updateJumpFromCBTO() {
  updateJumpPreview();
}

function calculateCBTOFromDesiredJump() {
  const desiredJump = parseFloat(document.getElementById('r-desired-jump')?.value);
  const landsInput = document.getElementById('r-lands');
  const cbtoInput = document.getElementById('r-cbto');
  const preview = document.getElementById('jump-preview');

  if (!desiredJump || !landsInput || !cbtoInput) return;

  const lands = parseFloat(landsInput.value);
  if (!lands) return;

  // CBTO = Touching Lands - Desired Jump
  const newCBTO = lands - desiredJump;
  cbtoInput.value = newCBTO.toFixed(3);

  // Update preview
  if (preview) {
    preview.innerHTML = desiredJump >= 0 
      ? `${desiredJump.toFixed(3)}" jump` 
      : `${Math.abs(desiredJump).toFixed(3)}" jam`;
  }
}

// --- SAVE DATA ---
function saveModalForm() {
  const type = currentType;
  if (!type) return;
  let item = { id: currentEditId || generateId() };

  if (type === 'firearms') {
    // Check if the preview image has valid Base64 data to save
    const photoPreview = document.getElementById('f-photo-preview');
    if (photoPreview && photoPreview.src.startsWith('data:')) {
      item.photo = photoPreview.src;
    } else if (currentEditId) {
      // Keep old photo if none was uploaded this time
      const oldItem = state.firearms.find(x => x.id === currentEditId);
      item.photo = oldItem ? oldItem.photo : null;
    }

    item.make = document.getElementById('f-make').value;
    item.model = document.getElementById('f-model').value;
    item.serialNumber = document.getElementById('f-serial').value;
    item.type = document.getElementById('f-type').value;
    item.caliber = document.getElementById('f-cal').value;
    item.notes = document.getElementById('f-notes').value;
    if (currentEditId) state.firearms[state.firearms.findIndex(x => x.id === currentEditId)] = item;
    else state.firearms.push(item);
  } 
  else if (type === 'barrels') {
    item.firearmId = document.getElementById('b-firearm').value;
    item.name = document.getElementById('b-name').value.trim();
    item.length = document.getElementById('b-length').value;
    item.material = document.getElementById('b-material').value;
    item.isCurrent = document.getElementById('b-current')?.checked || false;
    item.roundCount = currentEditId ? state.barrels.find(x => x.id === currentEditId).roundCount : 0;

    if (item.isCurrent) {
      state.barrels.forEach(b => { if (b.firearmId === item.firearmId && b.id !== item.id) b.isCurrent = false; });
    }
    
    if (currentEditId) state.barrels[state.barrels.findIndex(x => x.id === currentEditId)] = item;
    else state.barrels.push(item);
  } 
  else if (type === 'shooting') {
    item.date = document.getElementById('s-date').value;
    item.firearmId = document.getElementById('s-firearm').value;
    item.barrelId = document.getElementById('s-barrel').value || null;
    item.recipeId = document.getElementById('s-recipe').value || null;

    item.velocity = parseInt(document.getElementById('s-velocity').value) || null;
    item.groupSize = document.getElementById('s-group').value || null;

    // Support both main SD/ES fields and the new Load Details section
    const mainSd = parseFloat(document.getElementById('s-sd').value);
    const mainEs = parseFloat(document.getElementById('s-es').value);
    const loadSd = parseFloat(document.getElementById('s-load-sd')?.value);
    const loadEs = parseFloat(document.getElementById('s-load-es')?.value);

    item.sd = mainSd || loadSd || null;
    item.es = mainEs || loadEs || null;

    item.notes = document.getElementById('s-notes').value || document.getElementById('s-load-notes')?.value || '';

    // Calculate main session rounds from primary fields only.
    // Extra "+ Add Load" blocks are saved as separate log entries below.
    const mainRounds = (parseInt(document.getElementById('s-rounds').value) || 0)
                     + (parseInt(document.getElementById('s-load-rounds')?.value) || 0);
    item.roundsFired = mainRounds;

    // Create separate log entries for any additional "+ Add Load" blocks in this session
    const additionalContainer = document.getElementById('additional-loads-container');
    if (additionalContainer) {
      const extraBlocks = additionalContainer.querySelectorAll('[id^="extra-load-"]');
      extraBlocks.forEach(block => {
        const get = (cls) => block.querySelector('.' + cls)?.value || '';

        const extraRounds = parseInt(get('extra-rounds')) || 0;
        const extraVelocity = parseInt(get('extra-velocity')) || null;

        // Only create an entry if there's meaningful data
        if (extraRounds > 0 || extraVelocity || get('extra-group') || get('extra-sd')) {
          const extraLog = {
            id: generateId(),
            date: item.date,
            firearmId: item.firearmId,
            barrelId: item.barrelId,
            recipeId: item.recipeId,
            roundsFired: extraRounds,
            velocity: extraVelocity,
            groupSize: get('extra-group') || null,
            sd: parseFloat(get('extra-sd')) || null,
            es: null,
            notes: `Additional Load: ${get('extra-bullet-make')} ${get('extra-bullet-model')} ${get('extra-grains')}gr | ${get('extra-powder')} @ ${get('extra-charge')}gr
${get('extra-notes')}`
          };
          state.shootingLogs.push(extraLog);
        }
      });
    }

    let roundsDiff = item.roundsFired;
    if (currentEditId) {
      const oldItem = state.shootingLogs.find(x => x.id === currentEditId);
      roundsDiff = item.roundsFired - (oldItem ? oldItem.roundsFired : 0);
    }

    if (roundsDiff !== 0) {
      if (item.barrelId) {
        const barrel = state.barrels.find(b => b.id === item.barrelId);
        if (barrel) barrel.roundCount = (barrel.roundCount || 0) + roundsDiff;
      }
      
      if (item.recipeId) {
        const recipe = state.recipes.find(r => r.id === item.recipeId);
        if (recipe) {
          if (recipe.compIdBullet) {
            const b = state.components.find(c => c.id === recipe.compIdBullet);
            if (b) b.quantity = Math.max(0, (parseFloat(b.quantity) - roundsDiff).toFixed(0));
          }
          if (recipe.compIdPrimer) {
            const p = state.components.find(c => c.id === recipe.compIdPrimer);
            if (p) p.quantity = Math.max(0, (parseFloat(p.quantity) - roundsDiff).toFixed(0));
          }
          if (recipe.compIdPowder && recipe.chargeGr) {
            const pow = state.components.find(c => c.id === recipe.compIdPowder);
            if (pow) pow.quantity = Math.max(0, (parseFloat(pow.quantity) - (roundsDiff * recipe.chargeGr / 7000)).toFixed(4));
          }
        }
      }
    }
    
    if (currentEditId) state.shootingLogs[state.shootingLogs.findIndex(x => x.id === currentEditId)] = item;
    else state.shootingLogs.push(item);
  } 
  else if (type === 'ladder-test') {
    // Create a detailed shooting log entry from ladder test data
    const newLog = {
      id: generateId(),
      date: document.getElementById('lt-date').value,
      firearmId: document.getElementById('lt-firearm').value,
      recipeId: document.getElementById('lt-recipe').value || null,
      roundsFired: parseInt(document.getElementById('lt-rounds').value) || 10,
      velocity: parseInt(document.getElementById('lt-velocity').value) || null,
      groupSize: document.getElementById('lt-group').value || null,
      sd: parseFloat(document.getElementById('lt-sd').value) || null,
      es: parseFloat(document.getElementById('lt-es').value) || null,
      notes: `Load Test: ${document.getElementById('lt-bullet-make').value || ''} ${document.getElementById('lt-bullet-model').value || ''} ${document.getElementById('lt-grains').value || ''}gr | ${document.getElementById('lt-powder').value || ''} @ ${document.getElementById('lt-charge').value || ''}gr | Primer: ${document.getElementById('lt-primer').value || ''} | Brass: ${document.getElementById('lt-brass').value || ''}
${document.getElementById('lt-notes').value || ''}`
    };
    state.shootingLogs.push(newLog);
    saveState();
    hideModal();
    renderCurrentTab();
    showToast("Ladder test logged!");
    return; // prevent double save
  } 
  else if (type === 'recipes') {
    item.firearmId = document.getElementById('r-firearm').value || null;
    item.barrelId = document.getElementById('r-barrel').value || null;
    item.caliber = document.getElementById('r-cal').value;
    
    // Extract new bullet fields
    item.bulletMake = document.getElementById('r-bullet-make').value;
    item.bulletModel = document.getElementById('r-bullet-model').value;
    item.bulletGrains = document.getElementById('r-bullet-grains').value || null;
    delete item.bullet; // Clean up old data structure

    item.primer = document.getElementById('r-primer').value || null;
    item.brass = document.getElementById('r-brass').value || null;
    item.powder = document.getElementById('r-powder').value;
    item.chargeGr = parseFloat(document.getElementById('r-charge').value) || 0;
    item.notes = document.getElementById('r-notes').value || null;
    
    item.compIdBullet = document.getElementById('r-comp-bullet').value || null;
    item.compIdPrimer = document.getElementById('r-comp-primer').value || null;
    item.compIdPowder = document.getElementById('r-comp-powder').value || null;

    item.coal = parseFloat(document.getElementById('r-coal').value) || null;
    item.cbto = parseFloat(document.getElementById('r-cbto').value) || null;
    item.touchingLandsCBTO = parseFloat(document.getElementById('r-lands').value) || null;
    item.rifleLandsId = document.getElementById('r-linked')?.value || null;
    
    if (currentEditId) state.recipes[state.recipes.findIndex(x => x.id === currentEditId)] = item;
    else state.recipes.push(item);
  } 
  else if (type === 'components') {
    item.itemType = document.getElementById('c-type').value;
    item.manufacturer = document.getElementById('c-manu').value;
    item.nameSpec = document.getElementById('c-name').value;
    item.grains = document.getElementById('c-grains').value || null;   // for Bullet components
    item.quantity = parseFloat(document.getElementById('c-qty').value) || 0;
    item.unit = document.getElementById('c-unit').value;
    item.reorderLevel = parseFloat(document.getElementById('c-reorder').value) || 0;
    
    if (currentEditId) state.components[state.components.findIndex(x => x.id === currentEditId)] = item;
    else state.components.push(item);
  } 
  else if (type === 'rifle-lands') {
    item.rifleId = document.getElementById('rl-rifle').value;
    item.barrelId = document.getElementById('rl-barrel').value || null;
    item.bullet = document.getElementById('rl-bullet').value;
    item.touchingLandsCBTO = parseFloat(document.getElementById('rl-cbto').value) || null;
    
    if (currentEditId) state.rifleLands[state.rifleLands.findIndex(x => x.id === currentEditId)] = item;
    else state.rifleLands.push(item);
  } 
  else if (type === 'maintenance') {
    item.rifleId = document.getElementById('m-rifle').value;
    item.date = document.getElementById('m-date').value;
    item.action = document.getElementById('m-action').value;
    item.partsReplaced = document.getElementById('m-parts').value;
    item.notes = document.getElementById('m-notes').value;
    
    if (currentEditId) state.maintenance[state.maintenance.findIndex(x => x.id === currentEditId)] = item;
    else state.maintenance.push(item);
  }

  saveState();
  hideModal();
  renderCurrentTab();
  showToast("Saved successfully!");
}

// --- IMPORT / EXPORT ---
function exportData(withDate = false) {
  const dateStr = withDate ? `-${new Date().toISOString().split('T')[0]}` : '';
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(state, null, 2));
  a.download = `precision-reload-tracker${dateStr}.json`;
  a.click();
}

function importData() {
  const input = document.createElement('input');
  input.type = 'file'; 
  input.accept = '.json';
  input.onchange = e => {
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        state = JSON.parse(ev.target.result);
        saveState();
        renderCurrentTab();
        showToast("Data imported!");
      } catch(err) { 
        alert('Invalid file format. Please ensure you are uploading a valid JSON backup.'); 
      }
    };
    reader.readAsText(e.target.files[0]);
  };
  input.click();
}

function showSettings() {
  alert('Settings:\n- Use Backup regularly to save your data.\n- Use Import to load a previous backup.\n- Data is automatically saved locally to this browser.');
}

// --- INIT ---
function init() {
  loadState();
  renderDashboard();
  switchTab('dashboard');
}

window.onload = init;
</script>
</body>
